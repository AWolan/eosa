version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sales_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sales_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: ./web
    container_name: sales_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sales_db}?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount the local web directory to allow hot-reloading during development
      - ./web:/app
      - /app/node_modules
      - /app/.next

  producer:
    build:
      context: ./producer
    container_name: sales_producer
    restart: always
    environment:
      - API_URL=http://web:3000/api/sales
    depends_on:
      - web
    volumes:
      # Mount local producer folder for instant script updates
      - ./producer:/app

volumes:
  pgdata:
